# Entorno local. Todo se lanza a través del Makefile (make help).
name: puerta-elvira

services:
  # API en Deno (la Edge Function de Supabase, ejecutada tal cual contra el PostgreSQL local).
  api:
    image: denoland/deno:2.9.7
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app/supabase/functions/api
    command: deno task serve
    environment:
      HOME: /tmp
      DENO_DIR: /tmp/deno
      PORT: "8000"
      DATABASE_URL: postgresql://club:club@postgres:5432/club
      TEST_DATABASE_URL: postgresql://club:club@postgres:5432/club_test
      # En producción: __Host-pe_session y Secure (exige HTTPS).
      SESSION_COOKIE_NAME: pe_session
      SESSION_COOKIE_SECURE: "0"
      PASSWORD_HASH_COST: "${PASSWORD_HASH_COST:-10}"
      # Adjuntos de facturas en local (ignorado por git); en producción, Supabase Storage.
      DOCUMENT_STORAGE_DIR: /app/supabase/functions/api/.storage
    volumes:
      - ./:/app
      # Caché de módulos de Deno dentro del repo (ignorada por git): el volumen con nombre sería de root.
      - ./supabase/.deno-cache:/tmp/deno
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - api
      - vite

  vite:
    image: node:26-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app/apps/web
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      npm_config_cache: /tmp/npm-cache
      npm_config_update_notifier: "false"
    volumes:
      - ./:/app

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [e2e]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app/apps/web
    command: npx playwright test
    environment:
      HOME: /tmp
      npm_config_update_notifier: "false"
      E2E_BASE_URL: ${E2E_BASE_URL:-http://nginx}
      CI: ${CI:-}
    volumes:
      - ./:/app
    depends_on:
      - nginx

  # aws-cli solo para `make cloudfront` (perfil aparte: no arranca con `make up`).
  aws:
    image: amazon/aws-cli:2.33.17
    profiles: [aws]
    working_dir: /app
    volumes:
      - ./:/app:ro

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${DB_PORT:-5480}:5432"

volumes:
  postgres-data:
