# Entorno local. Todo se lanza a través del Makefile (make help).
name: puerta-elvira

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-dev}
  APP_DEBUG: ${APP_DEBUG:-1}
  APP_SECRET: ${APP_SECRET:-dev-secret-not-for-production}
  DEFAULT_URI: http://localhost:${APP_PORT:-8080}
  DATABASE_URL: postgresql://club:club@postgres:5432/club?serverVersion=17&charset=utf8

services:
  php-fpm:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    image: puerta-elvira/php:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment: *api-env
    volumes:
      - ./:/app
      - composer-cache:/tmp/composer
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/api/public:/app/apps/api/public:ro
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - php-fpm
      - vite

  vite:
    image: node:24-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app/apps/web
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      npm_config_cache: /tmp/npm-cache
      npm_config_update_notifier: "false"
    volumes:
      - ./:/app

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: [e2e]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app/apps/web
    command: npx playwright test
    environment:
      HOME: /tmp
      npm_config_update_notifier: "false"
      E2E_BASE_URL: ${E2E_BASE_URL:-http://nginx}
      CI: ${CI:-}
    volumes:
      - ./:/app
    depends_on:
      - nginx

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${DB_PORT:-5432}:5432"

volumes:
  postgres-data:
  composer-cache:
