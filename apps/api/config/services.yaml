# Registro de servicios.
#
# - Domain no se registra: son objetos de negocio puros que se construyen, no se inyectan.
# - Application registra los casos de uso; los puertos (interfaces en */Port/) se excluyen
#   y se enlazan explícitamente a su adaptador de Infrastructure más abajo.
# - Infrastructure registra adaptadores, controladores y el resto del pegamento de Symfony.
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Application\:
        resource: '../src/Application/'
        exclude:
            - '../src/Application/**/Port/'

    App\Infrastructure\:
        resource: '../src/Infrastructure/'
        exclude:
            - '../src/Infrastructure/Kernel.php'
            - '../src/Infrastructure/Persistence/Doctrine/Model/'

    # Puertos → adaptadores
    App\Application\Common\Port\TransactionRunner: '@App\Infrastructure\Persistence\Doctrine\DoctrineTransactionRunner'
    App\Application\Health\Port\DatabaseHealth: '@App\Infrastructure\Persistence\Doctrine\DoctrineDatabaseHealth'
    App\Application\Identity\Port\UserRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Identity\DoctrineUserRepository'
    App\Application\Identity\Port\SessionRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Identity\DoctrineSessionRepository'
    App\Application\Identity\Port\PasswordHasher: '@App\Infrastructure\Identity\Security\SymfonyPasswordHasher'
    App\Application\Identity\Port\SessionTokenGenerator: '@App\Infrastructure\Identity\Security\RandomSessionTokenGenerator'
    App\Application\Identity\Port\TemporaryPasswordGenerator: '@App\Infrastructure\Identity\Security\RandomTemporaryPasswordGenerator'
    App\Application\Identity\Port\LoginAttemptLimiter: '@App\Infrastructure\Identity\Security\RateLimiterLoginAttemptLimiter'
    App\Application\Teachers\Port\TeacherRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Teachers\DoctrineTeacherRepository'
    App\Application\Teachers\Port\TeacherQuery: '@App\Infrastructure\Teachers\SqlTeacherQuery'
    App\Application\Teachers\Port\TeacherAssignments: '@App\Infrastructure\Teachers\ClassesTeacherAssignments'
    App\Application\Classes\Port\ClassGroupRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Classes\DoctrineClassGroupRepository'
    App\Application\Classes\Port\EnrolmentRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Classes\DoctrineEnrolmentRepository'
    App\Application\Classes\Port\TeacherDirectory: '@App\Infrastructure\Classes\TeachersTeacherDirectory'
    App\Application\Classes\Port\ClassQuery: '@App\Infrastructure\Classes\SqlClassQuery'
    App\Domain\Common\Clock: '@App\Infrastructure\Clock\SystemClock'
    App\Application\Identity\Port\SecurityEventLog: '@App\Infrastructure\Identity\Logging\MonologSecurityEventLog'


when@test:
    services:
        # Los tests de integración piden los adaptadores concretos al contenedor,
        # aunque todavía no los use ningún punto de entrada.
        App\Infrastructure\Persistence\Doctrine\Repository\:
            resource: '../src/Infrastructure/Persistence/Doctrine/Repository/'
            autowire: true
            autoconfigure: true
            public: true
        App\Infrastructure\Persistence\Doctrine\DoctrineTransactionRunner:
            autowire: true
            autoconfigure: true
            public: true
        App\Infrastructure\Classes\:
            resource: '../src/Infrastructure/Classes/'
            autowire: true
            autoconfigure: true
            public: true
        App\Infrastructure\Teachers\:
            resource: '../src/Infrastructure/Teachers/'
            autowire: true
            autoconfigure: true
            public: true
        App\Infrastructure\Identity\Security\:
            resource: '../src/Infrastructure/Identity/Security/'
            autowire: true
            autoconfigure: true
            public: true
