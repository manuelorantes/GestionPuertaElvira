# Registro de servicios.
#
# - Domain no se registra: son objetos de negocio puros que se construyen, no se inyectan.
# - Application registra los casos de uso; los puertos (interfaces en */Port/) se excluyen
#   y se enlazan explícitamente a su adaptador de Infrastructure más abajo.
# - Infrastructure registra adaptadores, controladores y el resto del pegamento de Symfony.
parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Application\:
        resource: '../src/Application/'
        exclude:
            - '../src/Application/**/Port/'

    App\Infrastructure\:
        resource: '../src/Infrastructure/'
        exclude:
            - '../src/Infrastructure/Kernel.php'
            - '../src/Infrastructure/Persistence/Doctrine/Model/'

    # Puertos → adaptadores
    App\Application\Common\Port\TransactionRunner: '@App\Infrastructure\Persistence\Doctrine\DoctrineTransactionRunner'
    App\Application\Common\Port\Locks: '@App\Infrastructure\Persistence\Doctrine\PostgresAdvisoryLocks'
    App\Application\Health\Port\DatabaseHealth: '@App\Infrastructure\Persistence\Doctrine\DoctrineDatabaseHealth'
    App\Application\Identity\Port\UserRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Identity\DoctrineUserRepository'
    App\Application\Identity\Port\SessionRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Identity\DoctrineSessionRepository'
    App\Application\Identity\Port\PasswordHasher: '@App\Infrastructure\Identity\Security\SymfonyPasswordHasher'
    App\Application\Identity\Port\SessionTokenGenerator: '@App\Infrastructure\Identity\Security\RandomSessionTokenGenerator'
    App\Application\Identity\Port\TemporaryPasswordGenerator: '@App\Infrastructure\Identity\Security\RandomTemporaryPasswordGenerator'
    App\Application\Identity\Port\LoginAttemptLimiter: '@App\Infrastructure\Identity\Security\RateLimiterLoginAttemptLimiter'
    App\Application\Teachers\Port\TeacherRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Teachers\DoctrineTeacherRepository'
    App\Application\Teachers\Port\TeacherQuery: '@App\Infrastructure\Teachers\SqlTeacherQuery'
    App\Application\Teachers\Port\TeacherAssignments: '@App\Infrastructure\Teachers\ClassesTeacherAssignments'
    App\Application\Classes\Port\ClassGroupRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Classes\DoctrineClassGroupRepository'
    App\Application\Classes\Port\EnrolmentRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Classes\DoctrineEnrolmentRepository'
    App\Application\Classes\Port\TeacherDirectory: '@App\Infrastructure\Classes\TeachersTeacherDirectory'
    App\Application\Classes\Port\ClassQuery: '@App\Infrastructure\Classes\SqlClassQuery'
    App\Application\Classes\Port\StudentStatus: '@App\Infrastructure\Classes\StudentsStudentStatus'
    App\Application\Students\Port\StudentRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Students\DoctrineStudentRepository'
    App\Application\Students\Port\StudentQuery: '@App\Infrastructure\Students\SqlStudentQuery'
    App\Application\Students\Port\Enrolments: '@App\Infrastructure\Students\ClassesEnrolments'
    App\Application\Billing\Port\StudentDirectory: '@App\Infrastructure\Billing\SqlStudentDirectory'
    App\Application\Billing\Port\BillingQuery: '@App\Infrastructure\Billing\SqlBillingQuery'
    App\Application\Billing\Port\BillingSettingsRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Billing\DoctrineBillingSettingsRepository'
    App\Application\Billing\Port\StudentAccountRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Billing\DoctrineStudentAccountRepository'
    App\Application\Billing\Port\ChargeRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Billing\DoctrineChargeRepository'
    App\Application\Billing\Port\PaymentRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Billing\DoctrinePaymentRepository'
    App\Application\Billing\Port\DocumentSequence: '@App\Infrastructure\Persistence\Doctrine\Repository\Billing\SqlDocumentSequence'
    App\Application\Payroll\Port\ScheduleDirectory: '@App\Infrastructure\Payroll\SqlScheduleDirectory'
    App\Application\Payroll\Port\TeacherRates: '@App\Infrastructure\Payroll\SqlTeacherRates'
    App\Application\Payroll\Port\PayrollQuery: '@App\Infrastructure\Payroll\SqlPayrollQuery'
    App\Application\Payroll\Port\TimesheetRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Payroll\DoctrineTimesheetRepository'
    App\Application\Payroll\Port\SettlementRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Payroll\DoctrineSettlementRepository'
    App\Application\Payroll\Port\ProposalLog: '@App\Infrastructure\Persistence\Doctrine\Repository\Payroll\DoctrineSettlementRepository'
    App\Application\Common\Port\ClosedPeriods: '@App\Infrastructure\Accounting\SqlClosedPeriods'
    App\Application\Accounting\Port\LedgerQuery: '@App\Infrastructure\Accounting\SqlLedgerQuery'
    App\Application\Accounting\Port\InvoiceQuery: '@App\Infrastructure\Accounting\SqlInvoiceQuery'
    App\Application\Accounting\Port\DocumentStorage: '@App\Infrastructure\Accounting\LocalDocumentStorage'
    App\Application\Accounting\Port\ManualEntryRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Accounting\DoctrineAccountingRepository'
    App\Application\Accounting\Port\SupplierInvoiceRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Accounting\DoctrineAccountingRepository'
    App\Application\Accounting\Port\SeasonClosingRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\Accounting\DoctrineAccountingRepository'
    App\Domain\Common\Clock: '@App\Infrastructure\Clock\SystemClock'
    App\Application\Identity\Port\SecurityEventLog: '@App\Infrastructure\Audit\AuditedSecurityEventLog'
    App\Application\Import\Port\StudentMatcher: '@App\Infrastructure\Import\SqlStudentMatcher'
    App\Application\Audit\Port\AuditLog: '@App\Infrastructure\Audit\SqlAuditLog'
    App\Application\Audit\Port\AuditReverter: '@App\Infrastructure\Audit\SqlAuditLog'


