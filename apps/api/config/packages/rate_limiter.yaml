framework:
    rate_limiter:
        # 5 intentos fallidos por email cada 15 minutos.
        login_email:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.rate_limiter
            lock_factory: null
        # 30 intentos fallidos por IP cada 15 minutos (frena el «password spraying»).
        login_ip:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
            cache_pool: cache.rate_limiter
            lock_factory: null
