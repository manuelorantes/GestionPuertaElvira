# Reglas de dependencia de la arquitectura hexagonal
# (ver specs/decisions/arquitectura-hexagonal-ddd-en-symfony.md).
#   Infrastructure → Application → Domain
# Domain y Application no dependen de ningún vendor salvo las excepciones listadas.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#.*Kernel\.php$#'
  layers:
    - name: DomainCommon
      collectors:
        - type: classLike
          value: '^App\\Domain\\Common\\.*'
    - name: DomainIdentity
      collectors:
        - type: classLike
          value: '^App\\Domain\\Identity\\.*'
    - name: DomainStudents
      collectors:
        - type: classLike
          value: '^App\\Domain\\Students\\.*'
    - name: DomainClasses
      collectors:
        - type: classLike
          value: '^App\\Domain\\Classes\\.*'
    - name: DomainTeachers
      collectors:
        - type: classLike
          value: '^App\\Domain\\Teachers\\.*'
    - name: DomainBilling
      collectors:
        - type: classLike
          value: '^App\\Domain\\Billing\\.*'
    - name: DomainPayroll
      collectors:
        - type: classLike
          value: '^App\\Domain\\Payroll\\.*'
    - name: DomainAccounting
      collectors:
        - type: classLike
          value: '^App\\Domain\\Accounting\\.*'
    - name: Application
      collectors:
        - type: classLike
          value: '^App\\Application\\.*'
    - name: Infrastructure
      collectors:
        - type: classLike
          value: '^App\\Infrastructure\\.*'
    - name: Assertions
      collectors:
        - type: classLike
          value: '^Webmozart\\Assert\\.*'
    - name: Vendor
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^(?!App\\).*\\.*'
          must_not:
            - type: classLike
              value: '^Webmozart\\Assert\\.*'
  # Cada contexto de dominio solo puede usar DomainCommon; los contextos no se importan entre sí.
  ruleset:
    DomainCommon:
      - Assertions
    DomainIdentity:
      - DomainCommon
      - Assertions
    DomainStudents:
      - DomainCommon
      - Assertions
    DomainClasses:
      - DomainCommon
      - Assertions
    DomainTeachers:
      - DomainCommon
      - Assertions
    DomainBilling:
      - DomainCommon
      - Assertions
    DomainPayroll:
      - DomainCommon
      - Assertions
    DomainAccounting:
      - DomainCommon
      - Assertions
    Application:
      - DomainAccounting
      - DomainPayroll
      - DomainBilling
      - DomainCommon
      - DomainIdentity
      - DomainStudents
      - DomainClasses
      - DomainTeachers
      - Assertions
    Infrastructure:
      - DomainAccounting
      - DomainPayroll
      - DomainBilling
      - Application
      - DomainCommon
      - DomainIdentity
      - DomainStudents
      - DomainClasses
      - DomainTeachers
      - Assertions
      - Vendor
