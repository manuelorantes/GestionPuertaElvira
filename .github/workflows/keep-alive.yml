# Supabase pausa los proyectos gratuitos tras una semana sin actividad: esta consulta periódica
# a /api/health (que lee de la base de datos) lo mantiene activo (ver docs/despliegue.md).
name: Mantener activo

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Consulta /api/health
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Hora de inicio (para la sección Sistema)
        run: echo "TASK_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - run: curl -fsS --retry 3 --retry-delay 30 "$APP_URL/api/health"
        env:
          APP_URL: ${{ vars.APP_URL }}
      - name: Apuntar la ejecución (sección Sistema)
        # Siempre, también si algo falló; si no se puede apuntar, solo avisa: no hace fallar la tarea.
        if: always()
        run: |
          docker run --rm -e SUPABASE_DB_URL postgres:17-alpine psql "$SUPABASE_DB_URL" -qX -v ON_ERROR_STOP=1 -c \
            "INSERT INTO system_task_run (task, started_at, finished_at, outcome, manual, url)
             VALUES ('keep-alive', '$TASK_STARTED_AT', now(), '$OUTCOME', $MANUAL, '$RUN_URL')" \
            || echo "::warning::No se pudo apuntar la ejecución en system_task_run"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OUTCOME: ${{ job.status == 'success' && 'success' || 'failure' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
