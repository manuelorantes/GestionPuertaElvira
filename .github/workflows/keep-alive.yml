# Supabase pausa los proyectos gratuitos tras una semana sin actividad: esta consulta periódica
# a /api/health (que lee de la base de datos) lo mantiene activo (ver docs/despliegue.md).
name: Mantener activo

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Consulta /api/health
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - run: curl -fsS --retry 3 --retry-delay 30 "$APP_URL/api/health"
        env:
          APP_URL: ${{ vars.APP_URL }}
