# Diagnóstico de datos de cada noche (ver specs/features/diagnostico/spec.md): ejecuta las mismas reglas que el botón
# «Diagnosticar» de Contabilidad y deja los hallazgos nuevos esperando. Corre a las 22:00 UTC, media hora después de
# «Horas automáticas y cuotas», para que las cuotas del mes nuevo ya existan. Solo lee datos del club: nunca aplica
# ningún arreglo.
name: Diagnóstico de datos

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  diagnosticar:
    name: Ejecutar las reglas del diagnóstico
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
    steps:
      - name: Hora de inicio (para la sección Sistema)
        run: echo "TASK_STARTED_AT=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - name: Preparar el usuario del runner
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: app:diagnostics:run
        # La consola no toca documentos: DOCUMENT_STORAGE_DIR evita pedir las claves de Storage.
        run: |
          docker compose run --rm --no-deps -T -e DATABASE_URL -e DOCUMENT_STORAGE_DIR=/tmp/documentos \
            api deno task console app:diagnostics:run
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Apuntar la ejecución (sección Sistema)
        # Siempre, también si algo falló; si no se puede apuntar, solo avisa: no hace fallar la tarea.
        if: always()
        run: |
          docker run --rm -e SUPABASE_DB_URL postgres:17-alpine psql "$SUPABASE_DB_URL" -qX -v ON_ERROR_STOP=1 -c \
            "INSERT INTO system_task_run (task, started_at, finished_at, outcome, manual, url)
             VALUES ('diagnostico', '$TASK_STARTED_AT', now(), '$OUTCOME', $MANUAL, '$RUN_URL')" \
            || echo "::warning::No se pudo apuntar la ejecución en system_task_run"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OUTCOME: ${{ job.status == 'success' && 'success' || 'failure' }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
