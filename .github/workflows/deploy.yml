# Despliegue en producción (ver docs/despliegue.md): migraciones y Edge Function a Supabase,
# web compilada al bucket público de Storage. Se lanza con cada release (push a main).
# Hasta que exista la variable SUPABASE_PROJECT_REF (repositorio) los trabajos se omiten sin fallar.
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  HOST_UID: '1001'
  HOST_GID: '1001'
  SUPABASE_CLI_VERSION: 2.119.0

jobs:
  api:
    name: Base de datos y Edge Function
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Migraciones pendientes
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Secretos de la función
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            DATABASE_URL="$DATABASE_URL" \
            SESSION_COOKIE_NAME=__Host-pe_session \
            SESSION_COOKIE_SECURE=1 \
            DOCUMENT_BUCKET=documentos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DATABASE_URL: ${{ secrets.SUPABASE_POOLER_URL }}
      - name: Edge Function
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

  web:
    name: Web al bucket público
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Preparar el usuario del runner
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose run --rm --no-deps -T vite npm ci --no-audit --no-fund
      - run: make build-web
      - name: Subir la web (los ficheros con hash se cachean un año; el resto nunca)
        # La API REST de Storage con x-upsert sobrescribe; la CLI no (409) y detecta mal el tipo del HTML.
        # La clave de servicio se obtiene con el token de la CLI y nunca se imprime.
        run: |
          key=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')
          test -n "$key" || { echo "::error::No se pudo obtener la clave de servicio"; exit 1; }
          echo "::add-mask::$key"
          storage="https://$SUPABASE_PROJECT_REF.supabase.co/storage/v1"
          cd apps/web/dist
          upload() {
            case "$1" in
              *.html) type=text/html ;;
              *.js) type=text/javascript ;;
              *.css) type=text/css ;;
              *.svg) type=image/svg+xml ;;
              *.png) type=image/png ;;
              *.jpg|*.jpeg) type=image/jpeg ;;
              *.ico) type=image/x-icon ;;
              *.woff2) type=font/woff2 ;;
              *.txt) type=text/plain ;;
              *.json|*.webmanifest|*.map) type=application/json ;;
              *) type=application/octet-stream ;;
            esac
            curl -fsS -o /dev/null -X POST "$storage/object/$WEB_BUCKET/$1" \
              -H "Authorization: Bearer $key" -H "x-upsert: true" \
              -H "Content-Type: $type" -H "Cache-Control: $2" --data-binary "@$1"
            echo "subido $1 ($type)"
          }
          find assets -type f | while read -r f; do
            upload "$f" "public, max-age=31536000, immutable"
          done
          find . -type f -not -path './assets/*' -not -name index.html | sed 's#^\./##' | while read -r f; do
            upload "$f" no-cache
          done
          upload index.html no-cache
          # Restos de despliegues anteriores (la CLI anidó assets/assets).
          stale=$(curl -fsS -X POST "$storage/object/list/$WEB_BUCKET" -H "Authorization: Bearer $key" \
            -H "Content-Type: application/json" -d '{"prefix":"assets/assets","limit":1000}' \
            | jq -c '[.[] | "assets/assets/" + .name]')
          if [ "$stale" != "[]" ]; then
            curl -fsS -o /dev/null -X DELETE "$storage/object/$WEB_BUCKET" -H "Authorization: Bearer $key" \
              -H "Content-Type: application/json" -d "{\"prefixes\":$stale}" && echo "limpiado assets/assets"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          WEB_BUCKET: web

  comprobacion:
    name: La API responde
    if: vars.APP_URL != ''
    needs: [api, web]
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - run: curl -fsS --retry 5 --retry-delay 10 "$APP_URL/api/health"
        env:
          APP_URL: ${{ vars.APP_URL }}
