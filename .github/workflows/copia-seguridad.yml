# Copia de seguridad mensual de la base de datos de producción (ver docs/despliegue.md): pg_dump
# cifrado con una contraseña (el repositorio es público) y guardado como artefacto 90 días, así
# siempre hay tres copias recientes fuera de Supabase.
name: Copia de seguridad

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  dump:
    name: pg_dump cifrado
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Volcado (pg_dump 17, el mismo cliente que el servidor)
        run: |
          docker run --rm -e SUPABASE_DB_URL postgres:17-alpine sh -c \
            'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
               --schema=public --schema=supabase_migrations' > copia.dump
          test -s copia.dump || { echo "::error::El volcado ha salido vacío"; exit 1; }
          ls -l copia.dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Cifrar (AES-256 con la contraseña del secreto BACKUP_PASSPHRASE)
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-fd 0 -o "copia-$(date -u +%F).dump.gpg" copia.dump
          rm copia.dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v7
        with:
          name: copia-${{ github.run_id }}
          path: '*.dump.gpg'
          retention-days: 90
          if-no-files-found: error
