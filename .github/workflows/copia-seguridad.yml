# Copia de seguridad diaria de producción (ver docs/despliegue.md): pg_dump de la base de datos y los
# documentos del bucket privado «documentos», en un tar cifrado con una contraseña (el repositorio es
# público) y guardado como artefacto: 35 días las diarias y 90 (el máximo) la del día 1 de cada mes.
name: Copia de seguridad

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dump:
    name: pg_dump y documentos, cifrados
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Volcado (pg_dump 17, el mismo cliente que el servidor)
        run: |
          mkdir -p copia
          docker run --rm -e SUPABASE_DB_URL postgres:17-alpine sh -c \
            'pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
               --schema=public --schema=supabase_migrations' > copia/copia.dump
          test -s copia/copia.dump || { echo "::error::El volcado ha salido vacío"; exit 1; }
          ls -l copia/copia.dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Documentos del bucket privado
        # La lista sale de storage.objects (la API de Storage no lista de forma recursiva); cada fichero se
        # descarga con la clave de servicio, que se obtiene con el token de la CLI y nunca se imprime.
        run: |
          docker run --rm -e SUPABASE_DB_URL postgres:17-alpine sh -c \
            "psql \"\$SUPABASE_DB_URL\" -AtX -v ON_ERROR_STOP=1 \
               -c \"SELECT name FROM storage.objects WHERE bucket_id = '$DOCUMENT_BUCKET' ORDER BY name\"" \
            > documentos.txt
          total=$(grep -c . documentos.txt || true)
          echo "documentos en el bucket: $total"
          mkdir -p copia/documentos
          if [ "$total" -gt 0 ]; then
            key=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 10 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
              | jq -r '.[] | select(.name == "service_role") | .api_key')
            test -n "$key" || { echo "::error::No se pudo obtener la clave de servicio"; exit 1; }
            echo "::add-mask::$key"
            storage="https://$SUPABASE_PROJECT_REF.supabase.co/storage/v1"
            while read -r name; do
              mkdir -p "copia/documentos/$(dirname "$name")"
              curl -fsS --retry 3 --retry-all-errors --retry-delay 5 -o "copia/documentos/$name" \
                -H "Authorization: Bearer $key" "$storage/object/authenticated/$DOCUMENT_BUCKET/$name"
            done < documentos.txt
          fi
          copied=$(find copia/documentos -type f | wc -l)
          test "$copied" -eq "$total" || { echo "::error::Copiados $copied de $total documentos"; exit 1; }
          du -sh copia/documentos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          DOCUMENT_BUCKET: documentos
      - name: Cifrar (AES-256 con la contraseña del secreto BACKUP_PASSPHRASE)
        id: cifrar
        run: |
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          tar -C copia -cf copia.tar .
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-fd 0 -o "copia-$(date -u +%F).tar.gpg" copia.tar
          rm -r copia copia.tar
          # La del día 1 de cada mes se guarda 90 días (el máximo en un repositorio público); las demás, 35.
          if [ "$(date -u +%d)" = 01 ]; then echo "dias=90" >> "$GITHUB_OUTPUT"; else echo "dias=35" >> "$GITHUB_OUTPUT"; fi
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      - uses: actions/upload-artifact@v7
        with:
          name: copia-${{ github.run_id }}
          path: '*.tar.gpg'
          retention-days: ${{ steps.cifrar.outputs.dias }}
          if-no-files-found: error
