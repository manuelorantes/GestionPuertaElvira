# Puertas de calidad (ver specs/decisions/integracion-continua-y-puertas-de-calidad.md).
# Cada paso llama al mismo objetivo de make que se usa en local: `make ci` ≡ este workflow.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOST_UID: '1001'
  HOST_GID: '1001'

jobs:
  release-source:
    name: Origen de la release
    runs-on: ubuntu-latest
    steps:
      - name: Solo staging puede entrar en main
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'staging'
        run: |
          echo "::error::Los PR a main solo pueden venir de staging (este viene de '${{ github.head_ref }}')."
          exit 1
      - run: echo "Origen correcto"

  api:
    name: API (estilo, PHPStan, Deptrac, PHPUnit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Preparar el usuario del runner
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose build php-fpm
      - run: docker compose up -d --wait php-fpm postgres
      - run: docker compose exec -T php-fpm composer install --no-interaction --no-progress
      - run: make db-init
      - run: make lint-api
      - run: make coverage-api
      - run: make audit-api

  web:
    name: Web (ESLint, Prettier, TypeScript, knip, Vitest, build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Preparar el usuario del runner
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose run --rm --no-deps -T vite npm ci --no-audit --no-fund
      - run: make lint-web
      - run: make coverage-web
      - run: make build-web
      - run: make audit-web

  e2e:
    name: Extremo a extremo (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Preparar el usuario del runner
        run: echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV" && echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: docker compose build php-fpm
      - run: docker compose run --rm --no-deps -T php-fpm composer install --no-interaction --no-progress
      - run: docker compose run --rm --no-deps -T vite npm ci --no-audit --no-fund
      - run: make up
      - run: make db-init
      - run: make wait
      - run: make e2e
        env:
          CI: 'true'
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Logs de la pila
        if: failure()
        run: docker compose logs --no-color

  ci:
    name: CI
    if: always()
    needs: [release-source, api, web, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Todas las puertas en verde
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "CI en verde"
