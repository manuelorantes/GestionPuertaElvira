version: 2
updates:
  # La API en Deno declara sus dependencias en supabase/functions/api/deno.json (JSR y npm):
  # Dependabot aún no las gestiona; se revisan a mano con `deno outdated` desde `make sh`.
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    target-branch: staging
    groups:
      dev-tooling: { dependency-type: development }
    ignore:
      # typescript-eslint aún no admite TypeScript 7 (peer «<6.1.0»); revisar cuando lo haga.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Los tipos de Node siguen la versión mayor del runtime (node:24 en Docker y CI).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    target-branch: staging
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    target-branch: staging
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    target-branch: staging
