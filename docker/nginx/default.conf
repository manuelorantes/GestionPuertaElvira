# API y web en el mismo origen (ver specs/decisions/api-y-web-en-el-mismo-origen.md):
#   /api/*  → Symfony (php-fpm)
#   /*      → servidor de desarrollo de Vite (con HMR por WebSocket)
server {
    # Facturas con documento: hasta 10 MB (más el resto del formulario).
    client_max_body_size 12m;
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/apps/api/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/apps/api/public;
        fastcgi_param HTTPS off;
        fastcgi_read_timeout 60s;
    }

    location / {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
