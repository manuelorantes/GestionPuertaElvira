# API y web en el mismo origen (ver specs/decisions/api-y-web-en-el-mismo-origen.md):
#   /api/*  → API en Deno (la misma Edge Function que en producción; ver specs/decisions/backend-en-deno-sobre-supabase.md)
#   /*      → servidor de desarrollo de Vite (con HMR por WebSocket)
server {
    # Facturas con documento: hasta 10 MB (más el resto del formulario).
    client_max_body_size 12m;
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # El DNS de Docker se consulta en cada petición (variable + resolver): así un reinicio del
    # contenedor `api` no deja a nginx con una IP vieja.
    resolver 127.0.0.11 valid=10s;
    set $deno_api http://api:8000;
    location /api/ {
        proxy_pass $deno_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://vite:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
